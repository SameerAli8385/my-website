<!DOCTYPE html>
<html lang="hi">

  <title>Sameer Website</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;

    header {
      background: #222;
      color: white;
      padding: 40px 20px;
    }

    <h1>Welcome to Sameer's Website</h1>

  <div class="box">

    <p>यह मेरी पहली वेबसाइट है।</p>
    <button>Contact Me</button>
